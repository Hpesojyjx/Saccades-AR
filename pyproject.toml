[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "saccade-ar"
version = "0.1.0"
description = "Official experiment code for Saccade Autoregressive Generation on VAR and Infinity"
readme = "README.md"
requires-python = ">=3.10,<3.12"
license = {file = "LICENSE"}
dependencies = [
  "Pillow>=12.2",
]

[project.optional-dependencies]
var = [
  "torch==2.1.0",
  "torchvision==0.16.0",
  "numpy==1.26.4",
  "huggingface-hub==1.9.0",
  "typed-argument-parser==0.17.0",
  "tensorboard==2.20.0",
  "pytz==2026.1.post1",
  "tqdm==4.67.3",
]
infinity = [
  "torch==2.5.1",
  "torchvision==0.20.1",
  "numpy==2.2.6",
  "transformers==4.57.6",
  "huggingface-hub==0.36.2",
  "flash_attn==2.8.3",
  "timm==0.9.6",
  "einops==0.8.2",
  "safetensors==0.7.0",
  "sentencepiece==0.2.1",
  "opencv-python==4.13.0.92",
  "imageio==2.37.3",
  "pytz==2026.1.post1",
  "tqdm==4.67.3",
]
evaluation = [
  "pytorch-fid==0.3.0",
  "scipy==1.15.3",
]
test = [
  "pytest>=8,<9",
]

[tool.setuptools]
packages = []

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
